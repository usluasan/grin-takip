services:
  db:
    image: timescale/timescaledb-ha:pg16
    container_name: grin-db
    environment:
      POSTGRES_USER: grin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-grin_dev_pass}
      POSTGRES_DB: grin
    volumes:
      - db_data:/home/postgres/pgdata/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grin -d grin"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    container_name: grin-mqtt
    volumes:
      - ./backend/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./backend/mosquitto/acl:/mosquitto/config/acl:ro
      - mqtt_data:/mosquitto/data
      - mqtt_passwd:/mosquitto/passwd
    ports:
      - "1883:1883"
    restart: unless-stopped

  api:
    build: ./backend
    container_name: grin-api
    environment:
      DATABASE_URL: postgresql+psycopg://grin:${DB_PASSWORD:-grin_dev_pass}@db:5432/grin
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_ADMIN_USER: ${MQTT_ADMIN_USER:-grin-api}
      MQTT_ADMIN_PASSWORD: ${MQTT_ADMIN_PASSWORD:-grin_api_pass}
      MQTT_PASSWD_FILE: /mosquitto/passwd/passwd
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@arteverte.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      SEED_DEMO: ${SEED_DEMO:-1}
    volumes:
      - mqtt_passwd:/mosquitto/passwd
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    ports:
      - "8000:8000"
    restart: unless-stopped

  ingest:
    build: ./backend
    container_name: grin-ingest
    command: ["python", "-m", "app.ingest"]
    environment:
      DATABASE_URL: postgresql+psycopg://grin:${DB_PASSWORD:-grin_dev_pass}@db:5432/grin
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_ADMIN_USER: ${MQTT_ADMIN_USER:-grin-api}
      MQTT_ADMIN_PASSWORD: ${MQTT_ADMIN_PASSWORD:-grin_api_pass}
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    restart: unless-stopped

  web:
    build: ./web
    container_name: grin-web
    environment:
      VITE_API_BASE: /api/v1
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db_data:
  mqtt_data:
  mqtt_passwd:
  uploads:
