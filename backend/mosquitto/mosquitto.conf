listener 1883
persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Her cihaz kendi device_id / device_token ile bağlanır; API bu dosyayı günceller.
allow_anonymous false
password_file /mosquitto/passwd/passwd

# Cihazlar sadece kendi konularına yazabilsin
acl_file /mosquitto/config/acl
